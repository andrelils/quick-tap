version: '3.8'

services:
  mysql:
    image: mysql:5.7.44
    container_name: quicktap-mysql-dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: quick_tap
      MYSQL_USER: quicktap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quicktap123}
      TZ: 'Asia/Shanghai'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - quicktap-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # 本地开发 Redis（可选）：如果不想启用，可以在 .env 中设置 EXCLUDE_REDIS=true
    # 或者直接 docker compose up 时排除：docker compose up --scale redis=0
    image: redis:7-alpine
    container_name: quicktap-redis-dev
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - quicktap-network
    healthcheck:
      test: >
        sh -c "if [ -n '${REDIS_PASSWORD:-}' ]; then
                 redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping;
               else
                 redis-cli ping;
               fi"
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: quicktap-kafka-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - quicktap-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: quicktap-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - quicktap-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  quicktap-server:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: quicktap-server-dev
    ports:
      - "8222:8222"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # MySQL配置
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      # JWT配置（必须通过环境变量或.env文件设置）
      JWT_SECRET: ${JWT_SECRET}
      # Kafka配置（可选）
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      # Redis配置（开发环境默认关闭 REDIS_ENABLED=false）
      # 想启用 Redis：.env 中设置 REDIS_ENABLED=true，并同时起好 Redis 容器
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      # Seata 分布式事务（开发环境默认关闭，支付联调时设置 SEATA_ENABLED=true 开启）
      SEATA_ENABLED: ${SEATA_ENABLED:-false}
      SEATA_SERVER_ADDR: ${SEATA_SERVER_ADDR:-127.0.0.1:8091}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quicktap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  quicktap-network:
    driver: bridge
