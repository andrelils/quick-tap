# Seata file 模式配置文件（客户端兜底配置）
# 实际 TC 地址优先从 application.yml 的 seata.service.grouplist.default 读取
# 此文件仅用于 Seata Starter 在 registry.type=file / config.type=file 时的最小化加载

service {
  # 事务分组到 TC 集群的映射（与 application.yml 中 seata.service.vgroup-mapping 保持一致）
  vgroup_mapping.quicktap_tx_group_prod = "default"
  vgroup_mapping.quicktap_tx_group_dev = "default"
  # TC 集群地址（会被 application.yml 的 seata.service.grouplist.default 覆盖）
  default.grouplist = "127.0.0.1:8091"
  enableDegrade = false
  disable = false
  disableGlobalTransaction = false
}

client {
  rm {
    reportSuccessEnable = true
    tableMetaCheckEnable = false
    tableMetaCheckerInterval = 60000
    asyncCommitBufferLimit = 10000
    lockRetryInterval = 10
    lockRetryTimes = 30
  }
  tm {
    commitRetryCount = 3
    rollbackRetryCount = 3
    decodeBase64 = false
  }
}
