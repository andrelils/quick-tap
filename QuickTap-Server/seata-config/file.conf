# Seata Server (TC) 端配置 - file 模式核心配置
# 包含：事务日志存储、服务端口、事务分组映射等

service {
    # 事务分组映射（与客户端 application.yml 中 seata.tx-service-group 对应）
    vgroup_mapping.quicktap_tx_group_prod = "default"
    vgroup_mapping.quicktap_tx_group_dev = "default"
    # TC 集群地址（TC 端自身监听地址）
    default.grouplist = "127.0.0.1:8091"
    enableDegrade = false
    disable = false
    disableGlobalTransaction = false
}

store {
    # 事务日志存储模式：db（使用 MySQL 保证 TC 重启后事务状态不丢失）
    mode = "db"
    db {
        datasource = "druid"
        dbType = "mysql"
        driverClassName = "com.mysql.cj.jdbc.Driver"
        # TC 连接 MySQL 的 seata 库（建表脚本见 seata-config/seata-mysql.sql）
        # - Docker Compose 内部 MySQL：host=mysql；宿主机 MySQL：host=127.0.0.1 / host.docker.internal
        # 注意：如果使用 andre_sql 非 root 账号，请确认该账号有对 seata 库的读写权限
        url = "jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8"
        user = "root"
        # 生产环境实际密码：与 DB_PASSWORD 环境变量一致
        password = "lls_970401"
        # 与 DB_CONNECTION_LIMIT=10 对齐，TC 自身占用连接控制在较低水平
        minConn = 2
        maxConn = 8
        globalTable = "global_table"
        branchTable = "branch_table"
        lockTable = "lock_table"
        distributedLockTable = "distributed_lock"
        queryLimit = 100
        maxWait = 5000
    }
}

server {
    # TC 监听端口
    servicePort = 8091
    # 控制台端口
    consolePort = 7091
    # 事务协调器重试间隔
    recovery {
        committingRetryPeriod = 1000
        asyncCommittingRetryPeriod = 1000
        rollbackingRetryPeriod = 1000
        timeoutRetryPeriod = 1000
    }
    # 事务超时检查
    maxCommitRetryTimeout = "-1"
    maxRollbackRetryTimeout = "-1"
    rollbackFailedUnlockEnable = false
    enableCheckAuth = true
}

client {
    rm {
        reportSuccessEnable = true
        tableMetaCheckEnable = false
    }
    tm {
        commitRetryCount = 3
        rollbackRetryCount = 3
    }
}
