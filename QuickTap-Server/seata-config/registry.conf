# Seata Server (TC) 端配置 - 注册中心与配置中心
# 使用 file 模式，无需 Nacos 等外部注册中心

registry {
    # file 模式：TC 自身信息从 file.conf 读取，客户端通过直连 TC 地址注册
    type = "file"
    file {
        name = "file:/root/seata-config/file.conf"
    }
}

config {
    # file 模式：TC 配置从 file.conf 读取
    type = "file"
    file {
        name = "file:/root/seata-config/file.conf"
    }
}
