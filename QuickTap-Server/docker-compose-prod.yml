version: '3.8'

services:
  mysql:
    # ================================================
    # 说明：
    # 生产环境实际 MySQL 位于宿主机 127.0.0.1:3306
    #   DB_HOST=127.0.0.1, DB_PORT=3306, DB_USER=andre_sql, DB_NAME=andre_sql
    # 如果宿主机已有 MySQL，则无需启用此容器，将 quicktap-server 和
    # seata-server 的 DB_HOST / SEATA DB_HOST 改为 127.0.0.1 / host.docker.internal 即可。
    # 下面容器仅作为一键 docker 部署整套环境的兜底示例（DB_CONNECTION_LIMIT=10）
    # ================================================
    image: mysql:5.7.44
    container_name: quicktap-mysql-prod
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lls_970401}
      MYSQL_DATABASE: ${DB_NAME:-andre_sql}
      MYSQL_USER: ${DB_USER:-andre_sql}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lls_970401}
      TZ: 'Asia/Shanghai'
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seata-config/seata-mysql.sql:/docker-entrypoint-initdb.d/02-seata.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=${DB_CONNECTION_LIMIT:-1000}
    networks:
      - quicktap-network-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-lls_970401}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    # ================================================
    # 说明：
    # 生产环境实际 Redis 建议独立部署或直接使用宿主机 Redis（127.0.0.1:6379）
    # 如需使用宿主机 Redis，可将此服务注释掉，并在 quicktap-server 中设置：
    #   REDIS_HOST=host.docker.internal  （容器访问宿主机）
    #   REDIS_HOST=127.0.0.1              （jar 包直接在宿主机运行时）
    # 下面容器仅作为一键 docker 部署整套环境的兜底示例。
    # ================================================
    image: redis:7-alpine
    container_name: quicktap-redis-prod
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-lls_970401}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    volumes:
      - redis_data_prod:/data
    networks:
      - quicktap-network-prod
    healthcheck:
      # 带密码认证的健康检查；与 --requirepass 默认值保持一致
      test: >
        sh -c "redis-cli -a '${REDIS_PASSWORD:-lls_970401}' --no-auth-warning ping"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: quicktap-zookeeper-prod
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - quicktap-network-prod
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: quicktap-kafka-prod
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
    depends_on:
      - zookeeper
    networks:
      - quicktap-network-prod
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  seata-server:
    # Seata Server (TC) - 分布式事务协调器
    # 替代原 Nacos 方案：使用 file 模式直连，无需注册中心
    # 支付等核心业务通过 @GlobalTransactional 接入分布式事务
    image: seataio/seata-server:1.7.0
    container_name: quicktap-seata-server-prod
    environment:
      # 事务日志存储模式：使用数据库（MySQL）保证 TC 高可用
      SEATA_IP: seata-server
      SEATA_PORT: 8091
      STORE_MODE: db
      # Seata Server 使用 file 模式注册自身（无需 Nacos）
      SEATA_CONFIG_NAME: file:/root/seata-config/registry
    volumes:
      # 挂载 Seata Server 配置文件（registry.conf / file.conf）
      # 注意：file.conf 中已配置 MySQL 连接信息，生产部署请修改其中的密码
      - ./seata-config:/root/seata-config
      - seata_logs_prod:/root/logs
    ports:
      - "8091:8091"
      - "7091:7091"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quicktap-network-prod
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7091/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  quicktap-server:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: quicktap-server-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # MySQL配置（与生产环境实际配置一致：andre_sql / 127.0.0.1 / andre_sql）
      # 使用 Docker 内部 mysql 容器时 DB_HOST=mysql；使用宿主机 MySQL 时 DB_HOST=host.docker.internal
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-andre_sql}
      DB_USER: ${DB_USER:-andre_sql}
      DB_USERNAME: ${DB_USER:-andre_sql}
      DB_PASSWORD: ${DB_PASSWORD:-lls_970401}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      # Redis配置（生产默认开启 REDIS_ENABLED=true）
      # 使用 Docker 内部容器：REDIS_HOST=redis
      # 使用宿主机 Redis：REDIS_HOST=host.docker.internal 或 127.0.0.1（jar 包直接运行时）
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lls_970401}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-3000}
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-16}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-8}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-4}
      # Kafka配置
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Seata TC 地址（直连 Seata Server，无需 Nacos）
      SEATA_SERVER_ADDR: seata-server:8091
      # JWT配置
      JWT_SECRET: ${JWT_SECRET:-your_strong_jwt_secret_key_in_production_must_be_changed}
      # CORS - 默认包含生产服务器 IP
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://154.8.138.48,http://154.8.138.48:8080,http://154.8.138.48:8222}
      # JVM配置
      JAVA_OPTS: -Xms512m -Xmx1024m -Djava.security.egd=file:/dev/./urandom
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seata-server:
        condition: service_healthy
    networks:
      - quicktap-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  mysql_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  seata_logs_prod:
    driver: local

networks:
  quicktap-network-prod:
    driver: bridge
